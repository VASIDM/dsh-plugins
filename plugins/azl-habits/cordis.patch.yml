# Habit memory + Azur Lane Live2D viewer.
# Two independent plugins share this bundle so each keeps its own sidebar panel,
# Host half and configuration row.
- insert:
    - id: azl-habits
      name: '@local/azl-habits'
      config:
        enabled: true
        learnFromConversations: true
        injectIntoPrompt: true
        maxHabits: 40
        maxEvidencePerSession: 200
    - id: azl-l2d
      name: '@local/azl-habits/l2d'
      config:
        source: 'ddddbug/Live2d-model'
        allowNetwork: true
